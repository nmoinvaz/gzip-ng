name: CMake
on: [push, pull_request]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j 3
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Build benchmarks
        run: |
          cmake -B build-bench -DCMAKE_BUILD_TYPE=Release -DGZNG_ENABLE_BENCHMARKS=ON -DGZNG_ENABLE_TESTS=OFF
          cmake --build build-bench -j 3
