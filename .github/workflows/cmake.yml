name: CMake
on: [push, pull_request]
jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu GCC
            os: ubuntu-latest
            compiler: gcc
            cxx-compiler: g++

          - name: Ubuntu GCC ASAN
            os: ubuntu-latest
            compiler: gcc
            cxx-compiler: g++
            cmake-args: -DGZNG_SANITIZER=Address

          - name: Ubuntu GCC UBSAN
            os: ubuntu-latest
            compiler: gcc
            cxx-compiler: g++
            cmake-args: -DGZNG_SANITIZER=Undefined
            cflags: -O1

          - name: Ubuntu Clang TSAN
            os: ubuntu-latest
            compiler: clang
            cxx-compiler: clang++
            cmake-args: -DGZNG_SANITIZER=Thread

          - name: Ubuntu Clang MSAN
            os: ubuntu-latest
            compiler: clang
            cxx-compiler: clang++
            cmake-args: -DGZNG_SANITIZER=Memory

          - name: macOS Clang
            os: macos-latest
            compiler: clang
            cxx-compiler: clang++

          - name: macOS Clang TSAN
            os: macos-latest
            compiler: clang
            cxx-compiler: clang++
            cmake-args: -DGZNG_SANITIZER=Thread

    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.compiler }}
      CXX: ${{ matrix.cxx-compiler }}
      CFLAGS: ${{ matrix.cflags }}
      CXXFLAGS: ${{ matrix.cflags }}
      ASAN_OPTIONS: verbosity=0:abort_on_error=1:halt_on_error=1
      MSAN_OPTIONS: verbosity=0:abort_on_error=1:halt_on_error=1
      TSAN_OPTIONS: verbosity=0:abort_on_error=1:halt_on_error=1
      LSAN_OPTIONS: verbosity=0:abort_on_error=1:halt_on_error=1
      UBSAN_OPTIONS: verbosity=0:print_stacktrace=1:abort_on_error=1:halt_on_error=1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate project files
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake-args }}

      - name: Build project
        run: cmake --build build -j 3

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Build benchmarks
        if: ${{ !matrix.cmake-args }}
        run: |
          cmake -B build-bench -DCMAKE_BUILD_TYPE=Release -DGZNG_ENABLE_BENCHMARKS=ON -DGZNG_ENABLE_TESTS=OFF
          cmake --build build-bench -j 3
