name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, also the tag, e.g. 2.0.0
        required: true
        type: string
      ref:
        description: Commit, tag, or branch to build
        required: true
        type: string
        default: develop

permissions:
  contents: write

jobs:
  check:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      # The sources carry the version twice, and a release must match both.
      - name: Version matches the sources
        run: |
          want="${{ inputs.version }}"
          cmake=$(sed -n 's/^project(gzip-ng VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          header=$(sed -n 's/^#define GZNG_VERSION "\([0-9.]*\)".*/\1/p' gzng.h)
          test "$cmake" = "$want" || { echo "CMakeLists.txt says $cmake, not $want"; exit 1; }
          test "$header" = "$want" || { echo "gzng.h says $header, not $want"; exit 1; }
          if git ls-remote --exit-code origin "refs/tags/$want" > /dev/null; then
            echo "tag $want already exists"
            exit 1
          fi

      - name: Resolve the commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: check
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Ubuntu GCC x86_64
            os: ubuntu-22.04
            arch: linux-x86_64

          - name: Ubuntu GCC ARM64
            os: ubuntu-22.04-arm
            arch: linux-arm64

          - name: macOS Clang ARM64
            os: macos-latest
            arch: macos-arm64

          - name: macOS Clang x86_64
            os: macos-latest
            arch: macos-x86_64
            cmake-args: -DCMAKE_OSX_ARCHITECTURES=x86_64 -DGZNG_ENABLE_TESTS=OFF
            skip-tests: true

          - name: Windows MSVC x64
            os: windows-latest
            arch: windows-x64

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Generate project files
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake-args }}

      - name: Build project
        run: cmake --build build -j 3 --config Release

      - name: Run tests
        if: ${{ !matrix.skip-tests }}
        timeout-minutes: 20
        run: ctest --test-dir build -C Release --output-on-failure --timeout 120

      - name: Package
        if: runner.os != 'Windows'
        run: |
          dir=gzip-ng-${{ inputs.version }}-${{ matrix.arch }}
          mkdir -p pkg/$dir
          cp build/gzip-ng LICENSE.md README.md pkg/$dir/
          if [ "$RUNNER_OS" = "Linux" ]; then
            strip pkg/$dir/gzip-ng
          fi
          tar -czf $dir.tar.gz -C pkg $dir

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          $dir = "gzip-ng-${{ inputs.version }}-${{ matrix.arch }}"
          New-Item -ItemType Directory -Path pkg/$dir | Out-Null
          Copy-Item build/Release/gzip-ng.exe, LICENSE.md, README.md pkg/$dir/
          Compress-Archive -Path pkg/$dir -DestinationPath "$dir.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.arch }}
          path: |
            *.tar.gz
            *.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: [check, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt

      - name: Create the tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create ${{ inputs.version }} dist/*
          --repo ${{ github.repository }}
          --target ${{ needs.check.outputs.sha }}
          --title "gzip-ng ${{ inputs.version }}"
          --generate-notes
